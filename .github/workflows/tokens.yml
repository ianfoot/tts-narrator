name: tokens
# Verifies that the design- and text-token codegen is up to date.
# Triggers on any PR that touches a token source of truth
# (app/assets/theme/tokens.json, app/assets/text_tokens.json), the codegen
# itself, or the public theme surface. Runs the generator and fails the build
# if the checked-in app_tokens.g.dart / app_text_tokens.g.dart files drifted.

on:
  pull_request:
    paths:
      - 'app/assets/theme/tokens.json'
      - 'app/assets/text_tokens.json'
      - 'app/tool/generate_tokens.dart'
      - 'app/lib/src/gui/theme/app_tokens.dart'
      - 'app/lib/src/gui/theme/app_tokens.g.dart'
      - 'app/lib/src/gui/theme/app_text_tokens.dart'
      - 'app/lib/src/gui/theme/app_text_tokens.g.dart'
      - '.github/workflows/tokens.yml'
  push:
    branches: [main]
    paths:
      - 'app/assets/theme/tokens.json'
      - 'app/assets/text_tokens.json'
      - 'app/tool/generate_tokens.dart'
      - 'app/lib/src/gui/theme/app_tokens.dart'
      - 'app/lib/src/gui/theme/app_tokens.g.dart'
      - 'app/lib/src/gui/theme/app_text_tokens.dart'
      - 'app/lib/src/gui/theme/app_text_tokens.g.dart'
      - '.github/workflows/tokens.yml'

jobs:
  regenerate:
    name: codegen matches token JSON
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Run codegen
        run: dart run tool/generate_tokens.dart
      - name: Verify no drift
        run: |
          ok=1
          if ! git diff --exit-code -- lib/src/gui/theme/app_tokens.g.dart; then
            echo '::error::app_tokens.g.dart is out of date. Run `dart run tool/generate_tokens.dart` from app/ and commit the result.'
            ok=0
          fi
          if ! git diff --exit-code -- lib/src/gui/theme/app_text_tokens.g.dart; then
            echo '::error::app_text_tokens.g.dart is out of date. Run `dart run tool/generate_tokens.dart` from app/ and commit the result.'
            ok=0
          fi
          test $ok -eq 1