name: Build macOS

on:
  push:
    tags: [ '*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: .

      - name: Build macOS
        working-directory: app
        run: flutter build macos --release

      - name: Package zip
        run: ditto -c -k --sequesterRsrc --keepParent "app/build/macos/Build/Products/Release/TTS Narrator.app" tts-narrator-${GITHUB_REF_NAME}-macos.zip

      - name: Build DMG
        run: hdiutil create -volname "TTS Narrator" -srcfolder "app/build/macos/Build/Products/Release/TTS Narrator.app" -ov -format UDZO tts-narrator-${GITHUB_REF_NAME}-macos.dmg

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tts-narrator-${{ github.ref_name }}-macos.zip
            tts-narrator-${{ github.ref_name }}-macos.dmg
          token: ${{ secrets.GITHUB_TOKEN }}
