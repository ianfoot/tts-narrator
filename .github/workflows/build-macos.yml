name: Build macOS

on:
  push:
    tags: [ '*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: .

      - name: Build macOS
        working-directory: app
        run: flutter build macos --release

      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent "app/build/macos/Build/Products/Release/TTS Narrator.app" tts-narrator-macos.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: tts-narrator-macos.zip
          token: ${{ secrets.GITHUB_TOKEN }}
