name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Install dependencies
        run: flutter pub get
        working-directory: .
      - name: Analyze app
        run: flutter analyze
        working-directory: app
      - name: Analyze packages
        run: dart analyze packages/core

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Install dependencies
        run: flutter pub get
        working-directory: .
      - name: Run core Dart tests
        run: dart test
        working-directory: packages/core

      - name: Run Flutter widget tests
        run: flutter test
        working-directory: app
