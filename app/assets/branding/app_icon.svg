<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!--
    Application icon. This file is the source every shipped PNG is rendered
    from; it is never rasterized at runtime and nothing references it at build
    time.

    The background is full-bleed (0,0,512,512) rather than an inset squircle.
    Both target platforms draw their own shape mask over the icon body — macOS
    applies a squircle, GNOME a circle, KDE and XFCE a squircle — so a baked-in
    container would show as a rounded box inside a rounded box. For the same
    reason there is no drop shadow on the container: the shell already casts
    one, and stacking a second underneath made the artwork read as an inset.

    Because the background now fills the whole tile, the artwork is scaled UP
    115% about its own centre (262, 256) and re-centred on the canvas. The
    marks spanned 76% of the inset squircle as drawn; at 115% they span 77% of
    a full-bleed tile, so the icon carries the same visual weight here as it
    did when it was drawn inside a container.

    Regenerate with qlmanage + sips. The artwork itself needs no per-platform
    variant: full-bleed is correct wherever the shell owns the silhouette.
  -->
  <defs>
    <!-- Background Base Gradient (Matches App UI Light Gray Tone) -->
    <linearGradient id="appBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F4F4F6" />
    </linearGradient>

    <!-- Narrative Blue Bar Glow -->
    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#007AFF" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" fill="url(#appBg)" />

  <g transform="translate(256 256) scale(1.15) translate(-262 -256)">
    <!-- 1. LEFT SIDE: Input Text Lines (Dark Charcoal / Slate) -->
    <g fill="none" stroke-linecap="round">
      <line x1="100" y1="180" x2="190" y2="180" stroke="#18181B" stroke-width="18" />
      <line x1="100" y1="228" x2="160" y2="228" stroke="#71717A" stroke-width="18" />
      <line x1="100" y1="276" x2="200" y2="276" stroke="#18181B" stroke-width="18" />
      <line x1="100" y1="324" x2="175" y2="324" stroke="#71717A" stroke-width="18" />
    </g>

    <!-- 2. CENTER: Processing Prism Axis (App Blue #007AFF) -->
    <!-- Dotted Axis showing multi-model routing -->
    <line x1="236" y1="110" x2="236" y2="402" stroke="#007AFF" stroke-width="8" stroke-dasharray="12 16" stroke-linecap="round" opacity="0.4" />
    <!-- Active Central Node Bar -->
    <line x1="236" y1="150" x2="236" y2="362" stroke="#007AFF" stroke-width="14" stroke-linecap="round" filter="url(#blueGlow)" />

    <!-- 3. RIGHT SIDE: Audio Frequency Refraction (Vibrant UI Blue Output) -->
    <g fill="none" stroke-linecap="round" filter="url(#blueGlow)">
      <line x1="290" y1="200" x2="290" y2="312" stroke="#007AFF" stroke-width="22" />
      <line x1="334" y1="140" x2="334" y2="372" stroke="#007AFF" stroke-width="22" />
      <line x1="378" y1="180" x2="378" y2="332" stroke="#007AFF" stroke-width="22" opacity="0.85" />
      <line x1="422" y1="220" x2="422" y2="292" stroke="#007AFF" stroke-width="22" opacity="0.5" />
    </g>
  </g>
</svg>