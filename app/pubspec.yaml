name: tts_narrator
description: "OpenRouter TTS audiobook narration (macOS GUI)."
publish_to: 'none'
version: 0.1.0+1

resolution: workspace

environment:
  sdk: ^3.13.1

dependencies:
  audioplayers: ^6.8.1
  cupertino_icons: ^1.0.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  tts_narrator_core:
    path: ../packages/core
  tts_narrator_openrouter:
    path: ../packages/providers/openrouter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  audioplayers_platform_interface: ^7.2.0

flutter:
  uses-material-design: true